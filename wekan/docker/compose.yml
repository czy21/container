version: "3.9"

x-traefik-label: &traefik-label
  traefik.enable: true
  traefik.http.routers.wekan.service: wekan
  traefik.http.services.wekan.loadbalancer.server.port: 8080

services:

  wekan:
    image: wekanteam/wekan:v6.58
    container_name: wekan
    hostname: wekan
    expose:
      - "8080"
    labels:
      <<: *traefik-label
    privileged: true
    user: root
    volumes:
      - /volume1/storage/docker-data/wekan/data/:/data/
    environment:
      MONGO_URL: mongodb://admin:<secret_value>@db.czy21.com:27017/wekan?authSource=admin
      WRITABLE_PATH: /data
      ROOT_URL: http://
    restart: always