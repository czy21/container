services:

  beszel-agent:
    image: henrygd/beszel-agent:0.20.0
    container_name: beszel-agent
    network_mode: host
    volumes:
      - /volume1/storage/docker-data/beszel-agent/data/:/var/lib/beszel-agent/
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: 45876
      KEY: '<secret_value>'
      TOKEN: '<secret_value>'
      HUB_URL: 'https://beszel.czy21.com'
    restart: always