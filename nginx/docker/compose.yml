

services:
  nginx:
    image: nginx:1.31.6-alpine
    container_name: nginx
    privileged: true
    user: root
    network_mode: host
    volumes:
      - /volume1/storage/docker-data/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - /volume1/storage/docker-data/nginx/conf/conf.d/:/etc/nginx/conf.d/
      - /volume1/storage/docker-data/nginx/conf/snippets/:/etc/nginx/snippets/
      - /volume1/storage/docker-data/nginx/conf/cert/:/etc/nginx/cert/
      - /volume1/storage/docker-data/nginx/static/:/usr/share/nginx/static/
      - /volume1/storage/docker-data/nginx/cache/:/var/cache/nginx
    restart: always