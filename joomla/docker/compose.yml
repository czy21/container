version: "3.9"

x-traefik-label: &traefik-label
  traefik.enable: true
  traefik.http.routers.joomla.service: joomla
  traefik.http.services.joomla.loadbalancer.server.port: 80

services:
  joomla:
    image: joomla:4.3.3-php8.0-apache
    container_name: joomla
    hostname: joomla
    labels:
      <<: *traefik-label
    privileged: true
    user: root
    expose:
      - "80"
    volumes:
      - /volume1/storage/docker-data/joomla/data/:/var/www/html
    environment:
      JOOMLA_DB_HOST: "db.czy21.com"
      JOOMLA_DB_USER: "admin"
      JOOMLA_DB_PASSWORD: "Czy.190815"
      JOOMLA_DB_NAME: joomla
    restart: always