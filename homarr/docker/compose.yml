x-traefik-label: &traefik-label
  traefik.enable: true
  traefik.http.routers.homarr.service: homarr
  traefik.http.services.homarr.loadbalancer.server.port: 7575

services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:v1.77.2
    container_name: homarr
    labels:
      <<: *traefik-label
    privileged: true
    user: root
    volumes:
      - /volume1/storage/docker-data/homarr/data/:/appdata/
    environment:
      SECRET_ENCRYPTION_KEY: "<secret_value>"
      # DB_DRIVER: mysql2
      # DB_DIALECT: mysql
      # DB_URL: mysql://admin:<secret_value>@db.czy21.com:3306/homarr
    restart: always