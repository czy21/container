x-traefik-label: &traefik-label
  traefik.enable: true
  traefik.http.routers.nacos.service: nacos
  traefik.http.services.nacos.loadbalancer.server.port: 8080

services:

  nacos:
    image: nacos/nacos-server:v3.3.0
    pull_policy: always
    container_name: "nacos"
    hostname: "nacos"
    privileged: true
    user: root
    labels:
      <<: *traefik-label
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      PREFER_HOST_MODE: hostname
      MODE: standalone
      NACOS_AUTH_TOKEN: <secret_value>
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: <secret_value>
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: "db.czy21.com"
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_PORT: "3306"
      MYSQL_SERVICE_USER: "admin"
      MYSQL_SERVICE_PASSWORD: "<secret_value>"
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    restart: always