services:
  jenkins-ssh-agent:
    image: "registry.czy21.com/library/jenkins-ssh-agent:9.1.0-jdk25"
    container_name: jenkins-ssh-agent
    build:
      context: /home/runner/work/script/script/server/docker/ops/jenkins-ssh-agent/build/out
      dockerfile: Dockerfile
    privileged: true
    ports:
      - "5022:22"
    volumes:
      - jenkins-ssh-agent-data:/home/jenkins/
      - jenkins-ssh-agent-empty:/home/jenkins/agent
      - jenkins-ssh-agent-empty:/home/jenkins/.jenkins
      - /run/:/run/
      - /var/run/:/var/run/
      - /tmp/:/tmp/
      - /volume1/storage/docker-data/docker/conf/certs/:/docker-certs/client:ro
    environment:
      JENKINS_AGENT_SSH_PUBKEY: "<secret_value>"
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /docker-certs/client
      DOCKER_TLS_VERIFY: 1
    restart: always

volumes:
  jenkins-ssh-agent-data:
    name: jenkins-ssh-agent-data
  jenkins-ssh-agent-empty:
    name: jenkins-ssh-agent-empty